name: "clang-tidy"
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

jobs:
  tidy:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: plugins
          submodules: 'true'
          persist-credentials: false

      - name: Fetch ivi-homescreen
        working-directory: ${{github.workspace}}
        run: |
          git clone https://github.com/toyota-connected/ivi-homescreen.git
          cd ivi-homescreen
          git submodule update --init --recursive

      - name: Install packages
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=1200 -y update
          sudo apt-get -o DPkg::Lock::Timeout=1200 -y install \
            \
            ninja-build \
            \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            \
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev \
            mesa-utils \
            \
            libcurl4-openssl-dev \
            libevent-dev \
            libglfw3-dev \
            libicu-dev \
            libsecret-1-dev \
            libsdl2-dev \
            libuv1-dev \
            \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libavformat-dev libavutil-dev \
            \
            libunwind-dev \
            \
            libjpeg-turbo8-dev libturbojpeg0-dev libjpeg-dev \
            libpng-dev libwebp-dev \
            \
            libflatpak-dev libxml2-dev zlib1g-dev \
            libsystemd-dev

          sudo apt-get -o DPkg::Lock::Timeout=1200 -y install \
            clang \
            llvm \
            lldb \
            lld \
            libc++-dev \
            libc++abi-dev \
            libc++1 \
            libc++abi1

          pip3 install absl-py jinja2 ply meson --user

          cmake --version
          gcc --version

          clang-format --version
          find /usr -iname "*clang-tidy"
          run-clang-tidy --version

      - name: Cache libcamera
        id: cache-libcamera
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-libcamera
          path: |
            ${{github.workspace}}/libcamera/buildDir/staging/release/*

      - name: Build libcamera
        if: steps.cache-libcamera.outputs.cache-hit != 'true'
        working-directory: ${{github.workspace}}
        run: |
          git clone -b master https://git.libcamera.org/libcamera/libcamera.git
          cd libcamera && git checkout v0.4.0
          LIBCAMERA_STAGING=$PWD/buildDir/staging/release
          CC=/usr/bin/clang CXX=/usr/bin/clang++ \
          meson setup buildDir -Dqcam="disabled" -Dlc-compliance="disabled" -Dcam="disabled" -Dgstreamer="disabled" --prefix $LIBCAMERA_STAGING
          ninja -C buildDir install
          ls -laR $LIBCAMERA_STAGING

      - name: Cache filament
        id: cache-filament
        uses: actions/cache@v4
        with:
          path: |
            ${{github.workspace}}/filament/cmake-build-release/staging/release/*
          key: ${{ runner.os }}-filament

      - name: Build Filament
        if: steps.cache-filament.outputs.cache-hit != 'true'
        working-directory: ${{github.workspace}}
        run: |
          git clone -b release https://github.com/google/filament.git
          cd filament
          git checkout v1.56.7
          PATCHES=${{github.workspace}}/.github/workflows/patches
          git apply $PATCHES/filament/0001-disable-backend-tests.patch
          git apply $PATCHES/filament/0002-install-required-files.patch
          git apply $PATCHES/filament/0003-move-include-contents-to-include-filament.patch
          git apply $PATCHES/filament/0004-move-libraries-so-they-install.patch
          git apply $PATCHES/filament/0005-return-shader-type-mobile-for-linux-vulkan.patch

          FILAMENT_BUILD_DIR=$PWD/cmake-build-release
          FILAMENT_STAGING_DIR=${FILAMENT_BUILD_DIR}/staging/release
          mkdir -p $FILAMENT_BUILD_DIR
          cd $FILAMENT_BUILD_DIR
          CC=/usr/bin/clang CXX=/usr/bin/clang++ \
          cmake .. -GNinja \
            -D FILAMENT_SUPPORTS_VULKAN=ON \
            -D FILAMENT_ENABLE_LTO=ON \
            -D FILAMENT_SUPPORTS_OPENGL=OFF \
            -D FILAMENT_USE_EXTERNAL_GLES3=OFF \
            -D FILAMENT_SUPPORTS_WAYLAND=ON \
            -D FILAMENT_SUPPORTS_X11=OFF \
            -D FILAMENT_SUPPORTS_XCB=OFF \
            -D FILAMENT_SUPPORTS_EGL_ON_LINUX=OFF \
            -D FILAMENT_SKIP_SDL2=ON \
            -D FILAMENT_SKIP_SAMPLES=ON \
            -D FILAMENT_USE_SWIFTSHADER=OFF \
            -D BUILD_SHARED_LIBS=OFF \
            -D CMAKE_STAGING_PREFIX=${FILAMENT_STAGING_DIR} \
            -D CMAKE_BUILD_TYPE=Release
          ninja -C . install

      - name: Configure CMake
        working-directory: ${{github.workspace}}
        run: |
          find /usr -iname "llvm-config*"
          mkdir -p ${{github.workspace}}/build/release
          PKG_CONFIG_PATH=${{github.workspace}}/libcamera/buildDir/staging/release/lib/x86_64-linux-gnu/pkgconfig \
          CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake -GNinja \
            -S ${{github.workspace}}/ivi-homescreen \
            -B ${{github.workspace}}/build/release \
            -D LLVM_CONFIG=/usr/bin/llvm-config \
            -D ENABLE_STATIC_LINK=OFF \
            -D ENABLE_LTO=ON \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID} \
            -D CMAKE_VERBOSE_MAKEFILE=ON \
            -D ENABLE_DLT=OFF \
            -D BUILD_CRASH_HANDLER=OFF \
            \
            -D PLUGINS_DIR=${{github.workspace}}/plugins/plugins \
            \
            -D DEBUG_PLATFORM_MESSAGES=OFF \
            \
            -D BUILD_PLUGIN_AUDIOPLAYERS_LINUX=OFF \
            -D BUILD_PLUGIN_CAMERA=OFF \
            -D BUILD_PLUGIN_CLOUD_FIRESTORE=OFF \
            -D BUILD_PLUGIN_COMP_REGION=OFF \
            -D BUILD_PLUGIN_COMP_SURF=OFF \
            -D BUILD_PLUGIN_DESKTOP_WINDOW_LINUX=ON \
            -D BUILD_PLUGIN_FILAMENT_VIEW=ON \
            -D FILAMENT_INCLUDE_DIR=${{github.workspace}}/filament/cmake-build-release/staging/release/include \
            -D FILAMENT_LINK_LIBRARIES_DIR=${{github.workspace}}/filament/cmake-build-release/staging/release/lib/x86_64 \
            -D BUILD_PLUGIN_FILE_SELECTOR=ON \
            -D BUILD_PLUGIN_FIREBASE_AUTH=OFF \
            -D BUILD_PLUGIN_FIREBASE_CORE=OFF \
            -D BUILD_PLUGIN_FIREBASE_STORAGE=OFF \
            -D BUILD_PLUGIN_GO_ROUTER=ON \
            -D BUILD_PLUGIN_GOOGLE_SIGN_IN=OFF \
            -D BUILD_PLUGIN_INTEGRATION_TEST=OFF \
            -D BUILD_PLUGIN_LAYER_PLAYGROUND_VIEW=ON \
            -D BUILD_PLUGIN_NAV_RENDER_VIEW=ON \
            -D BUILD_PLUGIN_PDF=OFF \
            -D BUILD_PLUGIN_RIVE_TEXT=ON \
            -D BUILD_PLUGIN_SECURE_STORAGE=ON \
            -D BUILD_PLUGIN_URL_LAUNCHER=ON \
            -D BUILD_PLUGIN_VIDEO_PLAYER_LINUX=OFF \
            -D BUILD_PLUGIN_WEBVIEW_FLUTTER_VIEW=OFF \
            -D BUILD_PLUGIN_FLATPAK=ON \
            \
            -D BUILD_WATCHDOG=OFF \
            -D BUILD_SYSTEMD_WATCHDOG=OFF

          ln -s ${{github.workspace}}/build/release/compile_commands.json .

      - name: Build Homescreen
        run: |
          ninja -C ${{github.workspace}}/build/release

      - name: clang-tidy
        working-directory: ${{github.workspace}}
        run: |
          export FILE_LIST=$(find plugins -type d -name third_party -prune -false -o -name '*.cc' -o -name '*.hpp' -o -name '*.h')
          echo $FILE_LIST
          run-clang-tidy --help
          run-clang-tidy \
            -warnings-as-errors='*,-bugprone-macro-parentheses' \
            -quiet \
            -export-fixes=tidy-results-suggested-fixes.txt \
            $FILE_LIST \
            -extra-arg='-I${{github.workspace}}/ivi-homescreen/build/third_party/waypp/waypp/protocols' \
            -extra-arg='-I${{github.workspace}}/filament/cmake-build-release/staging/release/include' \
            -extra-arg='-I${{github.workspace}}/filament/cmake-build-release/staging/release/include/filament' \
            -extra-arg='-I${{github.workspace}}/filament/lib/utils/include' > tidy-results-log.txt

      - name: Show results
        if: always()
        run: |
          cat tidy-results-log.txt
          cat tidy-results-suggested-fixes.txt

      - name: Publish Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-results
          path: tidy-results-*
